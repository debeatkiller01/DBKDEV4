  <rect width="512" height="512" rx="128" fill="#0b0f19"/>
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#1e293b" stroke-width="8" fill="none"/>
  
  <!-- Scaled DBK Geometric Monogram -->
  <g transform="translate(64, 64) scale(12)">
    <!-- 1. Left Vertical Stem (D, B, K Backbone) -->
